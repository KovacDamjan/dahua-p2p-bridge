services:
  bridge-manager:
    image: damjankovac/dahua-p2p-bridge:latest
    pull_policy: always
    container_name: dahua-p2p-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Ljubljana}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in project environment}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in project environment}
      DATABASE_PATH: /app/data/bridge.db
      # NAS LAN address advertised to the Dahua cloud/P2P peer.
      P2P_ADVERTISE_IP: ${P2P_ADVERTISE_IP:?Set P2P_ADVERTISE_IP to the NAS LAN IP}
    # With host networking these ports are bound directly on the NAS.
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
