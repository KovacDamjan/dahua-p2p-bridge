<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dahua P2P Bridge</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#e8eef7;background:#0b1220}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:32px 20px}h1{margin:0}.muted{color:#91a0b8}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.card{background:#121c2e;border:1px solid #26344c;border-radius:14px;padding:20px;margin-top:20px}form.camera-form{display:grid;grid-template-columns:2fr 1fr 2fr 1fr;gap:12px}input,select,button{box-sizing:border-box;border-radius:8px;border:1px solid #384a68;background:#0e1728;color:#eef;padding:11px}button{background:#2878ff;border:0;font-weight:650;cursor:pointer}.danger{background:#923b48}.secondary{background:#334765}.actions{display:flex;gap:6px;flex-wrap:wrap}.row{display:grid;grid-template-columns:2fr 1fr 1fr 2fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #26344c}.badge{font-size:12px;padding:4px 8px;border-radius:20px;background:#493d19;color:#ffd979}code{color:#8dc1ff}.login-screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at top,#152948,#080d17);z-index:10}.login-card{width:min(390px,calc(100% - 40px));background:#121c2e;border:1px solid #304463;border-radius:18px;padding:30px;box-shadow:0 24px 80px #0008}.login-card form{display:grid;gap:12px}.login-card input,.login-card button{width:100%}.login-error{min-height:20px;color:#ff9aa8}.hidden{display:none!important}@media(max-width:760px){form.camera-form,.row{grid-template-columns:1fr}.row button{width:100%}}
   .details-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}.detail{background:#0e1728;border:1px solid #26344c;border-radius:10px;padding:12px}.detail strong{display:block;color:#8dc1ff;margin-bottom:6px}.stream-choice{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0} .live-wrap{display:grid;grid-template-columns:minmax(0,2fr) 1fr;gap:16px}.live-image{width:100%;min-height:240px;object-fit:contain;background:#050912;border-radius:10px;border:1px solid #26344c}.live-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.live-controls select{min-width:130px}@media(max-width:760px){.live-wrap{grid-template-columns:1fr}}</style>
</head>
<body>
<section id="login-screen" class="login-screen">
  <div class="login-card"><h1>Dahua P2P Bridge</h1><p class="muted">Prijava v upravljanje kamer</p>
    <form id="login-form"><input name="username" value="admin" autocomplete="username" required><input name="password" type="password" placeholder="Geslo" autocomplete="current-password" required><button>Prijava</button></form>
    <p id="login-error" class="login-error"></p>
  </div>
</section>
<main id="app" class="wrap hidden">
  <div class="top"><div><h1>Dahua P2P Bridge</h1><p class="muted">Večkameriski P2P prehod za Synology Surveillance Station · <span id="app-version">verzija …</span></p></div><button id="logout" class="secondary">Odjava</button></div>
  <section class="card"><h2>Dodaj kamero</h2><form id="form" class="camera-form">
    <input name="name" placeholder="Ime kamere" required>
    <select name="vendor"><option value="dahua">Dahua</option><option value="policetech">PoliceTech</option><option value="imou">IMOU</option></select>
    <input name="serial" placeholder="Serijska številka" required autocomplete="off">
    <input name="username" value="admin" placeholder="Uporabnik" required>
    <input name="password" type="password" placeholder="Geslo kamere" required autocomplete="new-password">
    <select name="stream"><option value="main">Glavni tok</option><option value="sub">Pomožni tok</option></select>
    <input name="channel" type="number" min="0" value="0" title="Kanal">
    <button>Dodaj</button>
  </form><p id="message" class="muted"></p></section>
  <section class="card"><h2>Kamere</h2><div id="cameras" class="muted">Za prikaz vnesi skrbniške podatke.</div></section><section id="details" class="card hidden"><div class="top"><div><h2 id="details-title">Nastavitve kamere</h2><p id="details-status" class="muted"></p></div><button id="details-close" class="secondary">Zapri</button></div><div id="details-body"></div></section><section id="live" class="card hidden"><div class="top"><div><h2 id="live-title">Live view</h2><p id="live-status" class="muted"></p></div><button id="live-close" class="secondary">Zapri</button></div><div class="live-wrap"><img id="live-image" class="live-image" alt="Live view kamere"><div><div class="live-controls"><label>Stream <select id="live-subtype"><option value="0">Main</option><option value="1">Sub</option></select></label><button id="live-start">Zaženi</button><button id="live-stop" class="secondary">Ustavi</button></div><p class="muted">Live view uporablja ločen lokalni RTSP odjemalec.</p></div></div></section>
</main><script>
function showLogin(){document.querySelector('#app').classList.add('hidden');document.querySelector('#login-screen').classList.remove('hidden')}
function showApp(){document.querySelector('#login-screen').classList.add('hidden');document.querySelector('#app').classList.remove('hidden')}
async function request(url,options={}){const r=await fetch(url,options);if(r.status===401){showLogin();throw Error('Seja je potekla')}if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.detail||r.statusText)}return r.status===204?null:r.json()}
async function copyText(text){if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return}const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.focus();area.select();const copied=document.execCommand('copy');area.remove();if(!copied)throw Error('Kopiranje ni uspelo')}


let liveCamera=null;
function startLive(){if(!liveCamera)return;const subtype=document.querySelector('#live-subtype').value;const image=document.querySelector('#live-image');image.src='/api/cameras/'+liveCamera.id+'/live?subtype='+subtype;document.querySelector('#live-status').textContent='Povezujem '+(subtype==='0'?'Main':'Sub')+' stream …';image.onload=()=>document.querySelector('#live-status').textContent='Live view aktiven';image.onerror=()=>document.querySelector('#live-status').textContent='Stream trenutno ni na voljo'}
function showLive(camera){liveCamera=camera;document.querySelector('#live').classList.remove('hidden');document.querySelector('#live-title').textContent='Live view · '+camera.name;document.querySelector('#live-subtype').value=camera.stream==='sub'?'1':'0';startLive()}
document.querySelector('#live-start').onclick=startLive;
document.querySelector('#live-stop').onclick=()=>{document.querySelector('#live-image').src='';document.querySelector('#live-status').textContent='Ustavljeno'};
document.querySelector('#live-close').onclick=()=>{document.querySelector('#live-stop').click();document.querySelector('#live').classList.add('hidden')};
async function showCapabilities(camera){const box=document.querySelector('#details'),body=document.querySelector('#details-body');box.classList.remove('hidden');document.querySelector('#details-title').textContent='Nastavitve · '+camera.name;body.innerHTML='<p class="muted">Pridobivam nastavitve iz kamere …</p>';try{const d=await request('/api/cameras/'+camera.id+'/capabilities');let out='<h3>Streama</h3><div class="stream-choice">';for(const s of d.streams){out+='<button class="secondary stream-btn" data-uri="'+esc(s.uri)+'">'+esc(s.name)+' · subtype='+s.subtype+'</button>'}out+='</div><h3>ONVIF profili</h3><div class="details-grid">';for(const p of d.profiles){out+='<div class="detail"><strong>'+esc(p.name||p.token||'Profil')+'</strong><span>'+esc(p.codec||'—')+' · '+esc(p.width||'?')+'×'+esc(p.height||'?')+'</span><br><span class="muted">FPS '+esc(p.fps||'—')+' · bitrate '+esc(p.bitrate||'—')+'</span></div>'}out+='</div><h3>RTSP URI</h3><div class="details-grid">';for(const s of d.streams){out+='<div class="detail"><strong>'+esc(s.name)+'</strong><code>'+esc(s.uri)+'</code></div>'}body.innerHTML=out;document.querySelectorAll('.stream-btn').forEach(b=>b.onclick=()=>document.querySelector('#message').textContent='Izbran '+b.textContent);document.querySelector('#details-status').textContent='Podatki prebrani prek ONVIF.'}catch(e){body.innerHTML='<p class="login-error">'+esc(e.message)+'</p>';document.querySelector('#details-status').textContent='Napaka pri pridobivanju nastavitev.'}}
document.querySelector('#details-close').onclick=()=>document.querySelector('#details').classList.add('hidden');
async function copyStatus(cameraId,button){const original=button.textContent;try{const status=await request('/api/cameras/'+cameraId+'/status');await copyText(JSON.stringify(status,null,2));button.textContent='Kopirano ✓';document.querySelector('#message').textContent='Celoten status in log sta kopirana v odložišče.'}catch(e){button.textContent='Napaka';document.querySelector('#message').textContent=e.message}finally{setTimeout(()=>button.textContent=original,1800)}}
async function load(){try{const list=await request('/api/cameras');const el=document.querySelector('#cameras');el.innerHTML=list.length?'':'Ni dodanih kamer.';for(const c of list){const row=document.createElement('div');row.className='row';row.innerHTML=`<strong>${esc(c.name)}</strong><span>${esc(c.vendor)}</span><span class="badge">${esc(c.status)}</span><code>Main: ${esc(c.rtsp_main)}<br>Sub: ${esc(c.rtsp_sub)}<br>ONVIF: ${esc(c.onvif_service)}</code><span class="actions"><button class="secondary copy">Kopiraj log</button><button class="secondary capabilities">Nastavitve</button><button class="secondary live">Live view</button><button class="secondary test">Poveži</button><button class="danger delete">Odstrani</button></span>`;row.querySelector('.copy').onclick=e=>copyStatus(c.id,e.currentTarget);row.querySelector('.capabilities').onclick=()=>showCapabilities(c);row.querySelector('.live').onclick=()=>showLive(c);row.querySelector('.test').onclick=async()=>{try{await request('/api/cameras/'+c.id+'/test',{method:'POST'});document.querySelector('#message').textContent='P2P povezovanje se je začelo.';setTimeout(load,3000)}catch(e){document.querySelector('#message').textContent=e.message}};row.querySelector('.delete').onclick=async()=>{if(confirm('Odstranim kamero?')){await request('/api/cameras/'+c.id,{method:'DELETE'});load()}};el.append(row)}}catch(e){document.querySelector('#cameras').textContent=e.message}}
function esc(v){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const body=Object.fromEntries(f);body.channel=Number(body.channel);body.enabled=true;body.motion_enabled=true;try{await request('/api/cameras',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});e.target.reset();document.querySelector('#message').textContent='Kamera je shranjena.';load()}catch(err){document.querySelector('#message').textContent=err.message}};
document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await request('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});document.querySelector('#login-error').textContent='';e.target.password.value='';showApp();load()}catch(err){document.querySelector('#login-error').textContent=err.message}};
document.querySelector('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});showLogin()};
(async()=>{try{const health=await fetch('/api/health',{cache:'no-store'}).then(r=>r.json());document.querySelector('#app-version').textContent='verzija '+health.version}catch{}try{await request('/api/session');showApp();load()}catch{showLogin()}})();
</script></body></html>
