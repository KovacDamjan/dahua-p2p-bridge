name: Build vendor container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.vendor'
      - 'vendor-worker/**'
      - 'app/p2p_manager.py'
      - 'requirements.txt'
      - '.github/workflows/vendor-container.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: vendor-container
  cancel-in-progress: true

jobs:
  build-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/kovacdamjan/dahua-p2p-bridge
            damjankovac/dahua-p2p-bridge
          tags: |
            type=raw,value=vendor
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vendor
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
