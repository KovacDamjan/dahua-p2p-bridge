name: Build container
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/kovacdamjan/dahua-p2p-bridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Export Synology image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker pull ghcr.io/kovacdamjan/dahua-p2p-bridge:latest
          docker tag ghcr.io/kovacdamjan/dahua-p2p-bridge:latest dahua-p2p-bridge:latest
          docker save dahua-p2p-bridge:latest -o dahua-p2p-bridge-amd64.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dahua-p2p-bridge-synology-amd64
          path: dahua-p2p-bridge-amd64.tar
          compression-level: 0
          retention-days: 30
