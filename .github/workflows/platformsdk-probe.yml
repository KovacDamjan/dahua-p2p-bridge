name: Build PlatformSDK probe

on:
  workflow_dispatch:
  push:
    paths:
      - vendor-worker/platformsdk_probe.c
      - .github/workflows/platformsdk-probe.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: cmd
        run: cl /nologo /O2 /W4 vendor-worker\platformsdk_probe.c /link /OUT:platformsdk_probe.exe
      - uses: actions/upload-artifact@v4
        with:
          name: platformsdk-probe
          path: platformsdk_probe.exe
