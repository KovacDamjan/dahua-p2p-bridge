services:
  bridge-manager:
    image: ghcr.io/kovacdamjan/dahua-p2p-bridge:latest
    container_name: dahua-p2p-bridge
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Ljubljana}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DATABASE_PATH: /app/data/bridge.db
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_RTSP_PORT: 8554
    ports:
      - "8095:8095"
      - "15540-15569:15540-15569"
    volumes:
      - ./data:/app/data
    depends_on:
      mediamtx:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  mediamtx:
    image: bluenviron/mediamtx:1.14.0
    container_name: dahua-p2p-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    security_opt:
      - no-new-privileges:true
